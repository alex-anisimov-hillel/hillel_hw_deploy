services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - books_shop_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  books_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - books_shop_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "chmod +x entrypoint.sh && ./entrypoint.sh && python manage.py collectstatic --noinput && gunicorn book_shop.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    volumes:
      - .:/app
      - django_static:/app/staticfiles
      - healthchecks:/app/healthchecks
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      books_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - books_shop_network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/', headers={'X-Forwarded-Proto': 'https'}))" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    restart: always
    networks:
      - books_shop_network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A book_shop worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      books_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - books_shop_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A book_shop beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - books_shop_network

networks:
  books_shop_network:
    driver: bridge

volumes:
  django_static:
  healthchecks:
  redis_data:
